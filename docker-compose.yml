version: '3.8'

services:
  s3-media-proxy:
    build: .
    image: toontoet/s3-media-proxy:latest
    container_name: s3-media-proxy
    ports:
      - "3333:3000"
    volumes:
      - ./storage.json:/config/storage.json:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

